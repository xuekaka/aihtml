<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双人聊天房间</title>
    <style>
      :root {
        --bg-a: #f2f5fb;
        --bg-b: #e8efe5;
        --ink: #25323a;
        --muted: #60707d;
        --panel: #ffffff;
        --line: #dbe3ea;
        --mine: #caebff;
        --theirs: #ffffff;
        --accent: #2a86d1;
        --danger: #c45252;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 14% 8%, #fff 0%, transparent 30%),
          radial-gradient(circle at 85% 12%, #fff8e5 0%, transparent 24%),
          linear-gradient(150deg, var(--bg-a) 0%, var(--bg-b) 100%);
        display: grid;
        place-items: center;
        padding: 1rem;
        overflow-x: hidden;
      }

      .shell {
        width: min(980px, 100%);
        max-width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 14px 32px rgba(24, 42, 58, 0.16);
        overflow: hidden;
      }

      .login {
        padding: 1.2rem;
        display: grid;
        gap: 0.8rem;
      }

      .login h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      .hint {
        color: var(--muted);
        margin: 0;
      }

      .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      input,
      button {
        font: inherit;
      }

      input {
        border: 1px solid #cfd7df;
        border-radius: 10px;
        padding: 0.56rem 0.7rem;
        min-width: 240px;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 0.56rem 1rem;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(140deg, #4aa2e7 0%, #2f80c6 100%);
        font-weight: 700;
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .error {
        color: var(--danger);
        font-weight: 700;
        min-height: 1.2rem;
      }

      .chat {
        display: none;
        grid-template-rows: auto 1fr auto;
        height: min(84vh, 760px);
      }

      .chat.show {
        display: grid;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: #f8fbff;
        padding: 0.8rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6rem;
      }

      .topbar strong {
        font-size: 1.05rem;
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .msgs {
        padding: 0.9rem;
        overflow: auto;
        background:
          linear-gradient(180deg, #f3f8ff 0%, #f9fbfd 100%);
      }

      .msg {
        display: grid;
        gap: 0.2rem;
        margin-bottom: 0.75rem;
        position: relative;
      }

      .msg.mine {
        justify-items: end;
      }

      .meta {
        color: var(--muted);
        font-size: 0.76rem;
      }

      .meta-line {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .msg.mine .meta-line {
        justify-content: flex-end;
      }

      .meta-action {
        border: 0;
        background: #ffffffcc;
        color: var(--muted);
        border-radius: 999px;
        padding: 0.08rem 0.42rem;
        cursor: pointer;
        font-size: 0.72rem;
        opacity: 0;
        transition: opacity 140ms ease, transform 140ms ease;
        transform: translateY(2px);
      }

      .msg:hover .meta-action,
      .msg:focus-within .meta-action {
        opacity: 1;
        transform: translateY(0);
      }

      .read-receipt {
        color: var(--muted);
        font-size: 0.74rem;
        padding: 0 0.15rem;
      }

      .bubble {
        max-width: min(76%, 580px);
        padding: 0.5rem 0.65rem;
        border-radius: 12px;
        border: 1px solid #d5dfeb;
        background: var(--theirs);
        word-break: break-word;
        white-space: pre-wrap;
      }

      .msg.mine .bubble {
        background: var(--mine);
        border-color: #a8d8f7;
      }

      .bubble.image {
        padding: 0.28rem;
      }

      .bubble img {
        display: block;
        max-width: min(70vw, 380px);
        border-radius: 10px;
      }

      .bubble.audio {
        padding: 0.42rem 0.52rem;
      }

      .audio-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        font-size: 0.83rem;
        color: #4f6678;
        margin-bottom: 0.35rem;
      }

      .audio-wave {
        letter-spacing: 0.05em;
        font-weight: 700;
      }

      .bubble audio {
        width: min(300px, 68vw);
        display: block;
      }

      .quote-block {
        border-left: 3px solid #9fc5ea;
        background: #edf6ff;
        color: #446174;
        border-radius: 9px;
        padding: 0.34rem 0.48rem;
        margin-bottom: 0.42rem;
        font-size: 0.84rem;
      }

      .quote-sender {
        font-weight: 700;
        margin-bottom: 0.1rem;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 0.7rem;
        gap: 0.6rem;
        background: #fbfdff;
        display: grid;
      }

      .composer-row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }

      .composer-row input {
        min-width: 0;
        flex: 1;
      }

      .recording-tip {
        display: none;
        align-items: center;
        gap: 0.45rem;
        color: #a14c32;
        font-size: 0.86rem;
        padding: 0 0.15rem;
      }

      .recording-tip.show {
        display: inline-flex;
      }

      .record-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e05841;
        box-shadow: 0 0 0 0 rgba(224, 88, 65, 0.45);
        animation: pulseDot 1.1s infinite;
      }

      .reply-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid #d6e2ee;
        border-radius: 12px;
        background: #f0f7ff;
      }

      .reply-bar.show {
        display: flex;
      }

      .reply-copy {
        min-width: 0;
      }

      .reply-title {
        font-size: 0.8rem;
        color: #4d6b80;
        font-weight: 700;
      }

      .reply-text {
        color: var(--ink);
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .reply-close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1rem;
        cursor: pointer;
      }

      .audio-draft {
        display: none;
        gap: 0.6rem;
        padding: 0.56rem 0.65rem;
        border: 1px solid #d6e2ee;
        border-radius: 12px;
        background: #f4f8ff;
      }

      .audio-draft.show {
        display: grid;
      }

      .audio-draft-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6rem;
      }

      .audio-draft-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .btn.secondary {
        color: #325a78;
        background: linear-gradient(140deg, #eef6ff 0%, #dfeefe 100%);
        border: 1px solid #c7ddf3;
      }

      .quote-menu {
        position: fixed;
        z-index: 40;
        display: none;
        min-width: 132px;
        background: #fff;
        border: 1px solid #d8e0e8;
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(32, 49, 63, 0.18);
        overflow: hidden;
      }

      .quote-menu.show {
        display: block;
      }

      .quote-menu button {
        width: 100%;
        text-align: left;
        padding: 0.68rem 0.8rem;
        border: 0;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }

      .quote-menu button:hover {
        background: #f2f7fc;
      }

      @keyframes pulseDot {
        0% {
          box-shadow: 0 0 0 0 rgba(224, 88, 65, 0.45);
        }
        100% {
          box-shadow: 0 0 0 12px rgba(224, 88, 65, 0);
        }
      }

      .mini {
        font-size: 0.86rem;
        color: var(--muted);
      }

      .back {
        color: #2f66a6;
        font-weight: 700;
        text-decoration: none;
      }

      @media (max-width: 680px) {
        .bubble {
          max-width: 90%;
        }

        .meta-action {
          opacity: 1;
          transform: translateY(0);
        }

        .composer {
          padding: 0.65rem;
        }

        .composer-row {
          gap: 0.45rem;
        }

        .btn {
          padding: 0.52rem 0.82rem;
        }

        #imageBtn,
        #audioBtn,
        #sendBtn {
          flex: 0 0 auto;
        }

        #msgInput {
          flex: 1 1 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="login" id="loginPanel">
        <h1>双人聊天房间</h1>
        <p class="hint">请输入账号登录（仅支持：白白 / 飞飞）。无密码。</p>
        <div class="row">
          <input id="accountInput" maxlength="2" placeholder="请输入账号" />
          <button class="btn" id="loginBtn">进入房间</button>
          <a class="back" href="./index.html">返回首页</a>
        </div>
        <div class="error" id="loginError"></div>
        <div class="mini">登录后会自动读取最近 100 条记录，并实时同步双方消息。</div>
      </section>

      <section class="chat" id="chatPanel">
        <header class="topbar">
          <div>
            <strong>聊天房间</strong>
            <div class="mini">账号：<span id="meText"></span></div>
          </div>
          <div class="status" id="statusText">连接中...</div>
        </header>

        <section class="msgs" id="msgs">
          <div id="historyLoader" style="text-align: center; padding: 0.6rem; display: none; color: var(--muted); font-size: 0.85rem;">
            正在加载历史消息...
          </div>
        </section>

        <footer class="composer">
          <div class="reply-bar" id="replyBar">
            <div class="reply-copy">
              <div class="reply-title" id="replyTitle">正在引用</div>
              <div class="reply-text" id="replyText"></div>
            </div>
            <button class="reply-close" id="replyClose" type="button" aria-label="取消引用">×</button>
          </div>
          <div class="audio-draft" id="audioDraftBar">
            <div class="audio-draft-top">
              <div class="reply-copy">
                <div class="reply-title">语音待发送</div>
                <div class="reply-text" id="audioDraftText">录音完成</div>
              </div>
              <button class="reply-close" id="audioDraftClose" type="button" aria-label="取消语音">×</button>
            </div>
            <audio id="audioPreviewPlayer" controls preload="metadata"></audio>
            <div class="audio-draft-actions">
              <button class="btn secondary" id="audioDraftRetry" type="button">重新录</button>
              <button class="btn" id="audioDraftSend" type="button">发送语音</button>
            </div>
          </div>
          <div class="composer-row">
            <input id="imageInput" type="file" accept="image/*" hidden />
            <button class="btn" id="imageBtn" type="button" aria-label="发送图片">图片</button>
            <button class="btn" id="audioBtn" type="button" aria-label="开始录音">录音</button>
            <input id="msgInput" maxlength="500" placeholder="输入消息，按 Enter 发送" />
            <button class="btn" id="sendBtn">发送</button>
          </div>
          <div class="recording-tip" id="recordingTip">
            <span class="record-dot" aria-hidden="true"></span>
            <span id="recordingText">录音中...</span>
          </div>
        </footer>
      </section>
    </main>

    <div class="quote-menu" id="quoteMenu">
      <button type="button" id="quoteMenuAction">引用这条消息</button>
    </div>

    <script src="./vendor/supabase-2.99.3.min.js"></script>
    <script>
      const SUPABASE_URL = "https://hdzeqsijrntnbdqdqyai.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkemVxc2lqcm50bmJkcWRxeWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNjUyMzMsImV4cCI6MjA4Nzk0MTIzM30.4Cd4h4XEdDZUvpQU6rlM08cEU8cZ5wqW3J_oYfxJVqk";

      const ALLOWED_ACCOUNTS = new Set(["白白", "飞飞"]);
      const ACCOUNT_DIR = {
        白白: "baibai",
        飞飞: "feifei",
      };
      const TABLE_NAME = "chat_messages";
      const READ_STATE_TABLE = "chat_read_state";
      const IMAGE_BUCKET = "chat-images";
      const AUDIO_BUCKET = "chat-audios";

      const loginPanel = document.getElementById("loginPanel");
      const chatPanel = document.getElementById("chatPanel");
      const accountInput = document.getElementById("accountInput");
      const loginBtn = document.getElementById("loginBtn");
      const loginError = document.getElementById("loginError");
      const statusText = document.getElementById("statusText");
      const meText = document.getElementById("meText");
      const msgs = document.getElementById("msgs");
      const replyBar = document.getElementById("replyBar");
      const replyTitle = document.getElementById("replyTitle");
      const replyText = document.getElementById("replyText");
      const replyClose = document.getElementById("replyClose");
      const audioDraftBar = document.getElementById("audioDraftBar");
      const audioDraftText = document.getElementById("audioDraftText");
      const audioPreviewPlayer = document.getElementById("audioPreviewPlayer");
      const audioDraftClose = document.getElementById("audioDraftClose");
      const audioDraftRetry = document.getElementById("audioDraftRetry");
      const audioDraftSend = document.getElementById("audioDraftSend");
      const quoteMenu = document.getElementById("quoteMenu");
      const quoteMenuAction = document.getElementById("quoteMenuAction");
      const imageInput = document.getElementById("imageInput");
      const imageBtn = document.getElementById("imageBtn");
      const audioBtn = document.getElementById("audioBtn");
      const recordingTip = document.getElementById("recordingTip");
      const recordingText = document.getElementById("recordingText");
      const msgInput = document.getElementById("msgInput");
      const sendBtn = document.getElementById("sendBtn");

      const supabaseGlobal = window.supabase;
      const sbClient =
        supabaseGlobal && typeof supabaseGlobal.createClient === "function"
          ? supabaseGlobal.createClient(SUPABASE_URL, SUPABASE_KEY)
          : null;

      let me = "";
      let channel = null;
      const seenIds = new Set();
      let oldestTimestamp = null;
      let hasMore = true;
      let isLoadingHistory = false;
      let isBulkRendering = false;
      let readStateMap = {
        白白: null,
        飞飞: null,
      };
      let replyTarget = null;
      let quoteMenuTarget = null;
      let longPressTimer = null;
      let mediaRecorder = null;
      let recordingStream = null;
      let audioChunks = [];
      let recordingStartedAt = 0;
      let pendingAudio = null;
      let composerBusy = false;

      function otherAccount() {
        return me === "白白" ? "飞飞" : "白白";
      }

      function previewTextFromRow(row) {
        if (!row) return "";
        if (row.type === "image") return "[图片]";
        if (row.type === "audio") return "[语音]";
        return String(row.content || "").replace(/\s+/g, " ").trim().slice(0, 80);
      }

      function formatDuration(ms) {
        const totalSeconds = Math.max(1, Math.round((ms || 0) / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function pickSupportedAudioMimeType() {
        if (typeof MediaRecorder === "undefined" || typeof MediaRecorder.isTypeSupported !== "function") {
          return "";
        }
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/ogg;codecs=opus",
          "audio/ogg",
        ];
        return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
      }

      function refreshComposerState() {
        const isRecording = !!(mediaRecorder && mediaRecorder.state === "recording");
        const hasPendingAudio = !!pendingAudio;

        sendBtn.disabled = composerBusy || isRecording || hasPendingAudio;
        imageBtn.disabled = composerBusy || isRecording || hasPendingAudio;
        msgInput.disabled = composerBusy || isRecording || hasPendingAudio;
        replyClose.disabled = composerBusy || isRecording || hasPendingAudio;
        audioDraftRetry.disabled = composerBusy || isRecording;
        audioDraftSend.disabled = composerBusy || isRecording;
        audioDraftClose.disabled = composerBusy || isRecording;

        if (isRecording) {
          audioBtn.disabled = composerBusy;
        } else {
          audioBtn.disabled = composerBusy || hasPendingAudio;
        }

        audioBtn.textContent = isRecording ? "结束" : "录音";
      }

      function setRecordingUI(isRecording, text = "录音中...") {
        recordingText.textContent = text;
        recordingTip.classList.toggle("show", isRecording);
        refreshComposerState();
      }

      function stopRecordingStream() {
        if (recordingStream) {
          recordingStream.getTracks().forEach((track) => track.stop());
          recordingStream = null;
        }
      }

      function resetRecorderState() {
        mediaRecorder = null;
        audioChunks = [];
        recordingStartedAt = 0;
        stopRecordingStream();
        setRecordingUI(false);
      }

      function clearPendingAudio() {
        if (pendingAudio && pendingAudio.previewUrl) {
          URL.revokeObjectURL(pendingAudio.previewUrl);
        }
        pendingAudio = null;
        audioPreviewPlayer.pause();
        audioPreviewPlayer.removeAttribute("src");
        audioPreviewPlayer.load();
        audioDraftText.textContent = "录音完成";
        audioDraftBar.classList.remove("show");
        refreshComposerState();
      }

      function setPendingAudio(blob, mimeType, durationMs) {
        clearPendingAudio();
        const previewUrl = URL.createObjectURL(blob);
        pendingAudio = {
          blob,
          mimeType,
          durationMs: Math.max(1000, durationMs || 0),
          previewUrl,
          replyInfo: replyTarget
            ? {
                id: replyTarget.id,
                sender: replyTarget.sender,
                type: replyTarget.type,
                preview: replyTarget.preview,
              }
            : null,
        };
        audioDraftText.textContent = `录音完成 ${formatDuration(pendingAudio.durationMs)}，可试听后发送`;
        audioPreviewPlayer.src = previewUrl;
        audioDraftBar.classList.add("show");
        setStatus("录音完成，请确认后发送");
        refreshComposerState();
      }

      function fmtTime(ts) {
        const d = new Date(ts);
        if (Number.isNaN(d.getTime())) return "";
        return d.toLocaleString();
      }

      function isNearBottom() {
        const threshold = 36;
        return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight <= threshold;
      }

      function setStatus(text) {
        statusText.textContent = text;
      }

      function setError(text) {
        loginError.textContent = text || "";
      }

      function clearReplyTarget() {
        replyTarget = null;
        replyBar.classList.remove("show");
      }

      function setReplyTarget(row) {
        if (!row || !row.id) return;
        replyTarget = {
          id: row.id,
          sender: row.sender,
          type: row.type,
          preview: previewTextFromRow(row),
        };
        replyTitle.textContent = `引用 ${row.sender}`;
        replyText.textContent = replyTarget.preview;
        replyBar.classList.add("show");
        closeQuoteMenu();
        msgInput.focus();
      }

      function closeQuoteMenu() {
        quoteMenu.classList.remove("show");
        quoteMenuTarget = null;
      }

      function openQuoteMenu(row, clientX, clientY) {
        quoteMenuTarget = row;
        const margin = 12;
        const menuWidth = 132;
        const menuHeight = 46;
        const x = Math.min(clientX, window.innerWidth - menuWidth - margin);
        const y = Math.min(clientY, window.innerHeight - menuHeight - margin);
        quoteMenu.style.left = `${Math.max(margin, x)}px`;
        quoteMenu.style.top = `${Math.max(margin, y)}px`;
        quoteMenu.classList.add("show");
      }

      function bindMessageInteractions(item, row) {
        const actionBtn = document.createElement("button");
        actionBtn.className = "meta-action";
        actionBtn.type = "button";
        actionBtn.textContent = "引用";
        actionBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setReplyTarget(row);
        });

        const meta = item.querySelector(".meta-line");
        meta.appendChild(actionBtn);

        item.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          openQuoteMenu(row, e.clientX, e.clientY);
        });

        item.addEventListener("pointerdown", (e) => {
          if (e.pointerType !== "touch") return;
          clearTimeout(longPressTimer);
          longPressTimer = window.setTimeout(() => {
            openQuoteMenu(row, e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
          }, 480);
        });

        ["pointerup", "pointermove", "pointercancel", "pointerleave"].forEach((eventName) => {
          item.addEventListener(eventName, () => {
            clearTimeout(longPressTimer);
          });
        });
      }

      function displayMessage(row, isPrepend = false) {
        if (!row || !row.id) return;
        if (seenIds.has(row.id)) return;
        seenIds.add(row.id);

        const item = document.createElement("article");
        item.className = `msg ${row.sender === me ? "mine" : ""}`;
        item.dataset.messageId = String(row.id);
        item.dataset.sender = row.sender;

        const meta = document.createElement("div");
        meta.className = "meta meta-line";
        const metaText = document.createElement("span");
        metaText.textContent = `${row.sender} · ${fmtTime(row.created_at)}`;
        meta.appendChild(metaText);

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (row.reply_to_message_id) {
          const quote = document.createElement("div");
          quote.className = "quote-block";
          const quoteSender = document.createElement("div");
          quoteSender.className = "quote-sender";
          quoteSender.textContent = row.reply_to_sender || "引用";
          const quotePreview = document.createElement("div");
          quotePreview.textContent = row.reply_to_preview || "";
          quote.append(quoteSender, quotePreview);
          bubble.appendChild(quote);
        }
        if (row.type === "image" && row.image_url) {
          bubble.classList.add("image");
          const img = document.createElement("img");
          img.src = row.image_url;
          img.alt = `${row.sender} 发的图片`;
          img.loading = "lazy";
          bubble.appendChild(img);
        } else if (row.type === "audio" && row.audio_url) {
          bubble.classList.add("audio");
          const chip = document.createElement("div");
          chip.className = "audio-chip";
          chip.innerHTML = `<span class="audio-wave">)))</span><span>${row.audio_duration_ms ? formatDuration(row.audio_duration_ms) : "语音"}</span>`;
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "metadata";
          audio.src = row.audio_url;
          if (row.audio_mime) {
            audio.setAttribute("type", row.audio_mime);
          }
          bubble.append(chip, audio);
        } else {
          const textNode = document.createElement("div");
          textNode.textContent = row.content;
          bubble.appendChild(textNode);
        }

        item.append(meta, bubble);
        bindMessageInteractions(item, row);

        if (isPrepend) {
          // Prepend below the loader
          const loader = document.getElementById("historyLoader");
          loader.insertAdjacentElement("afterend", item);
        } else {
          msgs.appendChild(item);
          if (!isBulkRendering) {
            msgs.scrollTop = msgs.scrollHeight;
          }
        }

        // Track oldest timestamp
        const ts = new Date(row.created_at).getTime();
        if (!oldestTimestamp || ts < oldestTimestamp) {
          oldestTimestamp = ts;
        }

        if (!isBulkRendering) {
          renderReadReceipt();
        }
      }

      function appendMessage(row) {
        displayMessage(row, false);
      }

      function resetMessages() {
        seenIds.clear();
        const loader = document.getElementById("historyLoader");
        msgs.innerHTML = "";
        msgs.appendChild(loader);
        oldestTimestamp = null;
        hasMore = true;
        isLoadingHistory = false;
      }

      async function loadRecent() {
        setStatus("正在读取最近100条记录...");
        const { data, error } = await sbClient
          .from(TABLE_NAME)
          .select("id,sender,type,content,image_url,audio_url,audio_mime,audio_duration_ms,reply_to_message_id,reply_to_sender,reply_to_type,reply_to_preview,created_at")
          .order("created_at", { ascending: false })
          .limit(100);

        if (error) {
          setStatus("读取历史失败");
          setError(`读取历史失败：${error.message}`);
          return;
        }

        resetMessages();
        if (data.length < 100) hasMore = false;
        isBulkRendering = true;
        data.reverse().forEach(appendMessage);
        isBulkRendering = false;
        msgs.scrollTop = msgs.scrollHeight;
        renderReadReceipt();
        setStatus("聊天记录已加载，正在连接实时消息...");
      }

      async function loadHistory() {
        if (isLoadingHistory || !hasMore || !oldestTimestamp) return;

        isLoadingHistory = true;
        const loader = document.getElementById("historyLoader");
        loader.style.display = "block";

        const oldScrollHeight = msgs.scrollHeight;

        const { data, error } = await sbClient
          .from(TABLE_NAME)
          .select("id,sender,type,content,image_url,audio_url,audio_mime,audio_duration_ms,reply_to_message_id,reply_to_sender,reply_to_type,reply_to_preview,created_at")
          .lt("created_at", new Date(oldestTimestamp).toISOString())
          .order("created_at", { ascending: false })
          .limit(100);

        loader.style.display = "none";
        isLoadingHistory = false;

        if (error) {
          console.error("加载历史失败:", error);
          return;
        }

        if (!data || data.length === 0) {
          hasMore = false;
          return;
        }

        if (data.length < 100) hasMore = false;

        // Prepend each message (desc order: newest older message first)
        isBulkRendering = true;
        data.forEach((row) => displayMessage(row, true));
        isBulkRendering = false;

        // Restore scroll position
        msgs.scrollTop = msgs.scrollHeight - oldScrollHeight;
        renderReadReceipt();
      }

      function renderReadReceipt() {
        msgs.querySelectorAll(".read-receipt").forEach((node) => node.remove());
        if (!me) return;

        const myMessages = Array.from(msgs.querySelectorAll(`.msg.mine[data-sender="${me}"]`));
        const lastMine = myMessages[myMessages.length - 1];
        if (!lastMine) return;

        const myMessageId = Number(lastMine.dataset.messageId || 0);
        if (!myMessageId) return;

        const otherReadId = Number(readStateMap[otherAccount()] || 0);
        const receipt = document.createElement("div");
        receipt.className = "read-receipt";
        receipt.textContent = otherReadId >= myMessageId ? "已读" : "未读";
        lastMine.appendChild(receipt);
      }

      async function loadReadState() {
        const { data, error } = await sbClient
          .from(READ_STATE_TABLE)
          .select("account,last_read_message_id");

        if (error) {
          console.error("读取已读状态失败:", error);
          return;
        }

        readStateMap = {
          白白: null,
          飞飞: null,
        };

        (data || []).forEach((row) => {
          readStateMap[row.account] = row.last_read_message_id;
        });

        renderReadReceipt();
      }

      function latestMessageId() {
        const items = Array.from(msgs.querySelectorAll(".msg[data-message-id]"));
        const last = items[items.length - 1];
        return last ? Number(last.dataset.messageId || 0) : null;
      }

      async function markAsReadIfNeeded() {
        if (!me || !document.hasFocus() || document.hidden || !isNearBottom()) return;

        const targetId = latestMessageId();
        if (!targetId) return;
        if (readStateMap[me] && Number(readStateMap[me]) >= targetId) return;

        readStateMap[me] = targetId;
        renderReadReceipt();

        const { error } = await sbClient.from(READ_STATE_TABLE).upsert(
          {
            account: me,
            last_read_message_id: targetId,
            updated_at: new Date().toISOString(),
          },
          { onConflict: "account" }
        );

        if (error) {
          console.error("更新已读状态失败:", error);
        }
      }

      // Add scroll listener for infinite scrolling
      msgs.addEventListener("scroll", () => {
        if (msgs.scrollTop <= 5 && !isLoadingHistory && hasMore) {
          loadHistory();
        }
        markAsReadIfNeeded();
      });

      async function sendMessage() {
        const content = (msgInput.value || "").trim();
        if (!content) return;
        if (!me) return;

        composerBusy = true;
        refreshComposerState();
        const { error } = await sbClient.from(TABLE_NAME).insert({
          sender: me,
          type: "text",
          content,
          reply_to_message_id: replyTarget ? replyTarget.id : null,
          reply_to_sender: replyTarget ? replyTarget.sender : null,
          reply_to_type: replyTarget ? replyTarget.type : null,
          reply_to_preview: replyTarget ? replyTarget.preview : null,
        });
        composerBusy = false;
        refreshComposerState();

        if (error) {
          setStatus("发送失败");
          alert(`发送失败：${error.message}`);
          return;
        }

        msgInput.value = "";
        clearReplyTarget();
        msgInput.focus();
      }

      async function readImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.onerror = (e) => {
            URL.revokeObjectURL(url);
            reject(e);
          };
          img.src = url;
        });
      }

      async function compressImage(file) {
        const img = await readImage(file);
        const maxSide = 1920;
        const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
        const width = Math.max(1, Math.round(img.width * ratio));
        const height = Math.max(1, Math.round(img.height * ratio));

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const outputType = file.type === "image/png" ? "image/png" : "image/jpeg";
        const quality = outputType === "image/jpeg" ? 0.88 : undefined;
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, outputType, quality));
        if (!blob) return file;
        return blob;
      }

      function extByType(type) {
        if (type === "image/png") return "png";
        if (type === "image/webp") return "webp";
        return "jpg";
      }

      async function sendImage(file) {
        if (!file || !me) return;
        if (!file.type || !file.type.startsWith("image/")) {
          alert("请选择图片文件");
          return;
        }

        composerBusy = true;
        refreshComposerState();
        setStatus("正在压缩图片...");

        let blob;
        try {
          blob = await compressImage(file);
        } catch (err) {
          composerBusy = false;
          refreshComposerState();
          setStatus("图片处理失败");
          alert(`图片处理失败：${err.message || err}`);
          return;
        }

        const type = blob.type || file.type || "image/jpeg";
        const ext = extByType(type);
        const safeDir = ACCOUNT_DIR[me] || "user";
        const path = `${safeDir}/${Date.now()}_${Math.random().toString(36).slice(2, 9)}.${ext}`;

        setStatus("正在上传图片...");
        const { error: uploadErr } = await sbClient.storage.from(IMAGE_BUCKET).upload(path, blob, {
          contentType: type,
          upsert: false,
        });

        if (uploadErr) {
          composerBusy = false;
          refreshComposerState();
          setStatus("上传失败");
          alert(`上传失败：${uploadErr.message}`);
          return;
        }

        const { data: urlData } = sbClient.storage.from(IMAGE_BUCKET).getPublicUrl(path);
        const imageUrl = urlData && urlData.publicUrl ? urlData.publicUrl : "";

        const { error: insertErr } = await sbClient.from(TABLE_NAME).insert({
          sender: me,
          type: "image",
          content: "图片",
          image_url: imageUrl,
          reply_to_message_id: replyTarget ? replyTarget.id : null,
          reply_to_sender: replyTarget ? replyTarget.sender : null,
          reply_to_type: replyTarget ? replyTarget.type : null,
          reply_to_preview: replyTarget ? replyTarget.preview : null,
        });

        composerBusy = false;
        refreshComposerState();

        if (insertErr) {
          setStatus("发送失败");
          alert(`发送图片消息失败：${insertErr.message}`);
          return;
        }

        imageInput.value = "";
        clearReplyTarget();
        setStatus("已连接，实时同步中");
      }

      async function sendAudioBlob(blob, mimeType, durationMs, replyInfo = null) {
        if (!blob || !me) return;

        composerBusy = true;
        refreshComposerState();
        setStatus("正在上传语音...");

        const ext = mimeType.includes("mp4") ? "m4a" : mimeType.includes("ogg") ? "ogg" : "webm";
        const safeDir = ACCOUNT_DIR[me] || "user";
        const path = `${safeDir}/${Date.now()}_${Math.random().toString(36).slice(2, 9)}.${ext}`;

        const { error: uploadErr } = await sbClient.storage.from(AUDIO_BUCKET).upload(path, blob, {
          contentType: mimeType,
          upsert: false,
        });

        if (uploadErr) {
          composerBusy = false;
          refreshComposerState();
          setStatus("语音上传失败");
          alert(`语音上传失败：${uploadErr.message}`);
          return false;
        }

        const { data: urlData } = sbClient.storage.from(AUDIO_BUCKET).getPublicUrl(path);
        const audioUrl = urlData && urlData.publicUrl ? urlData.publicUrl : "";

        const { error: insertErr } = await sbClient.from(TABLE_NAME).insert({
          sender: me,
          type: "audio",
          content: "语音",
          audio_url: audioUrl,
          audio_mime: mimeType,
          audio_duration_ms: Math.max(1000, durationMs || 0),
          reply_to_message_id: replyInfo ? replyInfo.id : null,
          reply_to_sender: replyInfo ? replyInfo.sender : null,
          reply_to_type: replyInfo ? replyInfo.type : null,
          reply_to_preview: replyInfo ? replyInfo.preview : null,
        });

        composerBusy = false;
        refreshComposerState();

        if (insertErr) {
          setStatus("发送失败");
          alert(`发送语音消息失败：${insertErr.message}`);
          return false;
        }

        clearReplyTarget();
        setStatus("已连接，实时同步中");
        return true;
      }

      async function startRecording() {
        if (!me) return;
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function" || typeof MediaRecorder === "undefined") {
          alert("当前浏览器不支持录音");
          return;
        }

        const mimeType = pickSupportedAudioMimeType();
        try {
          recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          alert(`无法启用麦克风：${err.message || err}`);
          return;
        }

        try {
          mediaRecorder = mimeType
            ? new MediaRecorder(recordingStream, { mimeType })
            : new MediaRecorder(recordingStream);
        } catch (err) {
          stopRecordingStream();
          alert(`当前浏览器录音初始化失败：${err.message || err}`);
          return;
        }

        audioChunks = [];
        recordingStartedAt = Date.now();

        mediaRecorder.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        });

        mediaRecorder.addEventListener("stop", async () => {
          const durationMs = Date.now() - recordingStartedAt;
          const finalType = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : mimeType || "audio/webm";
          const blob = new Blob(audioChunks, { type: finalType });
          resetRecorderState();
          if (blob.size > 0) {
            setPendingAudio(blob, finalType, durationMs);
          } else {
            setStatus("录音为空");
          }
        }, { once: true });

        mediaRecorder.start();
        setRecordingUI(true, "录音中，点击结束后进入确认");
      }

      function stopRecording() {
        if (!mediaRecorder) return;
        setRecordingUI(true, "正在处理语音...");
        mediaRecorder.stop();
      }

      async function subscribeRealtime() {
        if (channel) {
          await sbClient.removeChannel(channel);
        }

        channel = sbClient
          .channel("chat-room-realtime")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: TABLE_NAME },
            (payload) => {
              appendMessage(payload.new);
              markAsReadIfNeeded();
              setStatus("已连接，实时同步中");
            }
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: READ_STATE_TABLE },
            (payload) => {
              const row = payload.new || payload.old;
              if (!row || !row.account) return;
              readStateMap[row.account] = row.last_read_message_id;
              renderReadReceipt();
            }
          );

        channel.subscribe((status) => {
          if (status === "SUBSCRIBED") {
            setStatus("已连接，实时同步中");
          }
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            setStatus("实时连接异常");
          }
        });
      }

      async function doLogin() {
        const account = (accountInput.value || "").trim();
        if (!ALLOWED_ACCOUNTS.has(account)) {
          setError("登录失败：账号只能是“白白”或“飞飞”。");
          return;
        }

        if (!sbClient) {
          setError("登录失败：Supabase SDK 加载失败，请刷新重试。");
          return;
        }

        me = account;
        setError("");
        meText.textContent = me;
        setStatus("正在连接...");
        loginPanel.style.display = "none";
        chatPanel.classList.add("show");

        await Promise.all([loadReadState(), loadRecent()]);
        void subscribeRealtime();
        void markAsReadIfNeeded();
      }

      loginBtn.addEventListener("click", doLogin);
      accountInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();
      });

      sendBtn.addEventListener("click", sendMessage);
      replyClose.addEventListener("click", clearReplyTarget);
      audioDraftClose.addEventListener("click", () => {
        clearPendingAudio();
        setStatus("已取消语音");
      });
      audioDraftRetry.addEventListener("click", async () => {
        clearPendingAudio();
        await startRecording();
      });
      audioDraftSend.addEventListener("click", async () => {
        if (!pendingAudio) return;
        const audioToSend = pendingAudio;
        const sent = await sendAudioBlob(
          audioToSend.blob,
          audioToSend.mimeType,
          audioToSend.durationMs,
          audioToSend.replyInfo
        );
        if (sent) {
          clearPendingAudio();
        }
      });
      quoteMenuAction.addEventListener("click", () => {
        if (quoteMenuTarget) {
          setReplyTarget(quoteMenuTarget);
        }
      });
      imageBtn.addEventListener("click", () => imageInput.click());
      audioBtn.addEventListener("click", () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          stopRecording();
        } else {
          startRecording();
        }
      });
      imageInput.addEventListener("change", () => {
        const file = imageInput.files && imageInput.files[0];
        if (file) sendImage(file);
      });
      msgInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          markAsReadIfNeeded();
        }
      });

      document.addEventListener("click", (e) => {
        if (!quoteMenu.contains(e.target)) {
          closeQuoteMenu();
        }
      });

      document.addEventListener("scroll", closeQuoteMenu, { passive: true });

      window.addEventListener("focus", () => {
        markAsReadIfNeeded();
      });

      window.addEventListener("beforeunload", () => {
        clearPendingAudio();
        stopRecordingStream();
      });

      refreshComposerState();
    </script>
  </body>
</html>
